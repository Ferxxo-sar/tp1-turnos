    order: [day, month, year]
    formats:
      default: "%d/%m/%Y"
      short: "%d %b"
      long: "%A %-d de %B de %Y"
  time:
    am: am
    pm: pm
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%d/%m %H:%M"
      long: "%A %-d de %B, %H:%M hs"
      hour: "%H:%M"
  number:
